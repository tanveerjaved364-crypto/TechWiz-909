<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>My Learning - SkillSprint AI</title>
    <link rel="stylesheet" href="/static/style.css?v=employee2" />
    <link rel="stylesheet" href="/static/employee.css?v=1" />
  </head>
  <body>
    <header>
      <div><b>SkillSprint AI</b><span>Employee Learning Portal</span></div>
      <button class="secondary" id="logout">Logout</button>
    </header>
    <main>
      <section class="hero">
        <p>MY ONBOARDING</p>
        <h1 id="welcome">Your learning path</h1>
        <p id="role">Loading your profile...</p>
      </section>
      <div id="notice" class="notice" role="status"></div>
      <section id="progress" class="metrics"></section>
      <section class="employee-grid">
        <article>
          <h2>Assigned learning plan</h2>
          <p id="status"></p>
          <div id="items"></div>
        </article>
        <article>
          <h2>Submit supporting document</h2>
          <p class="hint">
            Your document stays Pending Review. Only an administrator or
            reviewer can approve it.
          </p>
          <form id="submitDoc">
            <input name="file" type="file" accept=".pdf,.docx" required /><input
              name="title"
              placeholder="Document title"
              required
            /><input
              name="version"
              placeholder="Version e.g. 1.0"
              required
            /><button>Submit for review</button>
          </form>
          <h3>My submissions</h3>
          <div id="submissions"></div>
        </article>
      </section>
    </main>
    <script src="/static/employee.js?v=employee2"></script>
  </body>
</html>
